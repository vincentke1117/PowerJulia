<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Julia-Grid Designer &amp; Optimizer</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="vendor/go.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <h1>Julia-Grid Designer &amp; Optimizer</h1>
      <div class="header-actions">
        <button id="btn-load-topology">导入 JSON</button>
        <button id="btn-save-topology">导出 JSON</button>
        <button id="btn-run-pf" class="primary">运行潮流</button>
        <button id="btn-run-optimization" class="primary">拓扑重构 + DG 优化</button>
      </div>
    </header>
    <main class="app-main">
      <section class="canvas-panel">
        <div id="palette" class="palette"></div>
        <div id="diagram" class="diagram"></div>
      </section>
      <aside class="sidebar" id="sidebar">
        <h2>计算结果</h2>
        <div class="results" id="results"></div>
        <h2>运行记录</h2>
        <ul id="run-history" class="run-history"></ul>
      </aside>
    </main>
    <input type="file" id="file-input" accept="application/json" hidden />
  </body>
</html>
